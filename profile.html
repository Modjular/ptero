<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 0 — U-Net throughput accounting on WebGPU</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --panel:#171a21; --fg:#e6e8ec; --mut:#9aa4b2; --acc:#5b9dff; --line:#262b36;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:15px; margin:28px 0 10px; }
  h3 { font-size:13px; margin:20px 0 8px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; }
  header p, .mut { margin:0; color:var(--mut); }
  header a { color:var(--acc); }
  main { padding:20px 24px 60px; max-width:1200px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:var(--panel); border:1px solid var(--line); font-size:12px; color:var(--mut); }
  .cards { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:150px; }
  .card .k { color:var(--mut); font-size:12px; }
  .card .v { font-size:19px; font-variant-numeric:tabular-nums; }
  .gate { border-left:3px solid var(--line); padding:8px 12px; margin:8px 0; background:var(--panel); border-radius:0 8px 8px 0; }
  .gate.pass { border-left-color:var(--ok); } .gate.fail { border-left-color:var(--bad); }
  .gate b { font-variant-numeric:tabular-nums; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th,td { text-align:right; padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; font-family:ui-monospace,Menlo,monospace; }
  th { color:var(--mut); font-weight:600; position:sticky; top:0; background:var(--bg); }
  td { font-variant-numeric:tabular-nums; }
  .scroll { overflow-x:auto; max-height:520px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .bar { height:26px; display:flex; border-radius:6px; overflow:hidden; border:1px solid var(--line); }
  .bar div { display:flex; align-items:center; justify-content:center; font-size:11px; color:#0b0d11; font-weight:600; overflow:hidden; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; font-size:12px; color:var(--mut); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
  .note { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:0 8px 8px 0; padding:10px 14px; margin:12px 0; }
  svg { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .wl { border-top:1px solid var(--line); margin-top:32px; padding-top:8px; }
  code { font-family:ui-monospace,Menlo,monospace; background:var(--panel); padding:1px 5px; border-radius:4px; }
</style></head>
<body>
<header>
  <h1>Phase 0 <span class="pill">accounting</span> — where U-Net inference time goes on WebGPU</h1>
  <p>Rendered from <code>results/phase0-*.json</code>, produced by <code>node tools/profile.mjs</code>. <a href="index.html">← all models</a></p>
</header>
<main id="main"><p class="mut">loading…</p></main>

<script type="module">
const $ = (id) => document.getElementById(id);
const pct = (x, d = 1) => x == null ? "—" : (x * 100).toFixed(d) + "%";
const num = (x, d = 0) => x == null ? "—" : x.toFixed(d);
const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

// Class colours double as the stacked-bar palette, so a bucket keeps the same colour
// in the legend, the bar and the roofline scatter.
const CLS = {
  "compute-bound-efficient":  "#3fb950",
  "compute-bound-below-roof": "#d29922",
  "memory-bound-at-roof":     "#58a6ff",
  "memory-bound-below-roof":  "#bc8cff",
  "launch-or-wave-limited":   "#f85149",
  "unclassified":             "#6e7681",
};
const STAGE_COLOR = {
  forward_wait: "#5b9dff", getmasks: "#f0883e", preprocess: "#3fb950", blend: "#bc8cff",
  tile_extract: "#d29922", pad: "#8b949e", crop: "#79c0ff", dyn_setup: "#ff7b72",
  dyn_wait: "#a5d6ff", resize_back: "#56d364",
};

async function findReport() {
  // No directory listing to rely on, so try today and walk back a fortnight.
  const d = new Date();
  for (let i = 0; i < 14; i++) {
    const stamp = new Date(d - i * 864e5).toISOString().slice(0, 10);
    const url = `results/phase0-${stamp}.json`;
    try {
      const r = await fetch(url);
      if (r.ok) return { url, data: await r.json() };
    } catch { /* keep walking back */ }
  }
  return null;
}

function stackedBar(parts, total) {
  const shown = parts.filter((p) => p.v / total > 0.004);
  return `<div class="bar">${shown.map((p) =>
    `<div style="width:${(p.v / total) * 100}%;background:${p.c}" title="${esc(p.k)}: ${pct(p.v / total)}">${
      (p.v / total) > 0.06 ? esc(p.k) : ""}</div>`).join("")}</div>
    <div class="legend">${shown.map((p) =>
      `<span><i style="background:${p.c}"></i>${esc(p.k)} ${pct(p.v / total)}</span>`).join("")}</div>`;
}

// Roofline scatter: log-log, dot area proportional to time so the eye weights by
// duration rather than by kernel count — the report's objection to treating every
// kernel as one dot.
function roofline(rows, roofs) {
  const W = 760, H = 420, ml = 62, mb = 46, mt = 16, mr = 16;
  const pts = rows.filter((r) => r.ai > 0 && r.gflops > 0);
  if (!pts.length) return "<p class='mut'>no classifiable dispatches</p>";
  const peak = roofs.sweep.peakGflops, bw = roofs.bandwidth.gbps;
  const xs = [0.5, 4096], ys = [1, Math.max(peak * 1.4, ...pts.map((p) => p.gflops))];
  const lx = (v) => ml + (Math.log10(v) - Math.log10(xs[0])) / (Math.log10(xs[1]) - Math.log10(xs[0])) * (W - ml - mr);
  const ly = (v) => H - mb - (Math.log10(v) - Math.log10(ys[0])) / (Math.log10(ys[1]) - Math.log10(ys[0])) * (H - mb - mt);
  const maxNs = Math.max(...pts.map((p) => p.ns));

  let roof = "";
  const steps = 80, seg = [];
  for (let i = 0; i <= steps; i++) {
    const ai = xs[0] * Math.pow(xs[1] / xs[0], i / steps);
    seg.push(`${lx(ai)},${ly(Math.min(peak, bw * ai))}`);
  }
  roof = `<polyline points="${seg.join(" ")}" fill="none" stroke="#e6e8ec" stroke-width="2" opacity=".75"/>`;

  const grid = [];
  for (const v of [1, 10, 100, 1000]) {
    if (v < xs[0] || v > xs[1]) continue;
    grid.push(`<line x1="${lx(v)}" y1="${mt}" x2="${lx(v)}" y2="${H - mb}" stroke="#262b36"/>`);
    grid.push(`<text x="${lx(v)}" y="${H - mb + 16}" fill="#9aa4b2" font-size="11" text-anchor="middle">${v}</text>`);
  }
  for (const v of [1, 10, 100, 1000]) {
    if (v > ys[1]) continue;
    grid.push(`<line x1="${ml}" y1="${ly(v)}" x2="${W - mr}" y2="${ly(v)}" stroke="#262b36"/>`);
    grid.push(`<text x="${ml - 8}" y="${ly(v) + 4}" fill="#9aa4b2" font-size="11" text-anchor="end">${v}</text>`);
  }
  const ridge = roofs.ridgeFromSweep;
  const ridgeLine = ridge ? `<line x1="${lx(ridge)}" y1="${mt}" x2="${lx(ridge)}" y2="${H - mb}"
      stroke="#d29922" stroke-dasharray="4 4"/><text x="${lx(ridge) + 5}" y="${mt + 12}"
      fill="#d29922" font-size="11">ridge ${ridge}</text>` : "";

  const dots = pts.map((p) => {
    const r = 2 + 9 * Math.sqrt(p.ns / maxNs);
    return `<circle cx="${lx(p.ai)}" cy="${ly(p.gflops)}" r="${r}" fill="${CLS[p.class] || "#6e7681"}"
      fill-opacity=".65" stroke="${CLS[p.class] || "#6e7681"}"><title>${esc(p.label)}
${num(p.ns / 1e6, 2)} ms · ${num(p.gflops)} GFLOP/s · AI ${num(p.ai)} · ${pct(p.attainment)} of attainable</title></circle>`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid.join("")}${roof}${ridgeLine}${dots}
    <text x="${ml + (W - ml - mr) / 2}" y="${H - 6}" fill="#9aa4b2" font-size="11" text-anchor="middle">arithmetic intensity (FLOP/byte, ideal CIO)</text>
    <text x="14" y="${mt + (H - mb - mt) / 2}" fill="#9aa4b2" font-size="11" text-anchor="middle" transform="rotate(-90 14 ${mt + (H - mb - mt) / 2})">achieved GFLOP/s</text>
  </svg>`;
}

function renderWorkload(res, roofs) {
  const g = res.gates, c = res.classification, w = res.workload;
  const stageParts = Object.entries(res.stages)
    .filter(([k]) => k !== "total" && k !== "tiles")
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => ({ k, v, c: STAGE_COLOR[k] || "#6e7681" }));
  const clsParts = Object.entries(c.buckets)
    .filter(([, v]) => v.ns > 0)
    .map(([k, v]) => ({ k, v: v.ns, c: CLS[k] }));

  // Aggregate the per-dispatch rows by label: the same conv runs once per tile, and the
  // per-tile repetition is noise in a table meant to show where time goes by layer.
  const agg = new Map();
  for (const d of res.dispatches) {
    const e = agg.get(d.label) || { ...d, ns: 0, n: 0 };
    e.ns += d.ns; e.n++; agg.set(d.label, e);
  }
  const rows = [...agg.values()].sort((a, b) => b.ns - a.ns);
  const totalNs = rows.reduce((s, r) => s + r.ns, 0);

  return `
  <div class="wl">
  <h2>${esc(w.id)} <span class="pill">${w.W}×${w.H}</span> <span class="pill">${res.stages.tiles ?? "?"} tile(s)</span>
      <span class="pill">${w.channels}ch · diam ${w.opts.diameter}</span> <span class="pill">${res.objects} objects</span></h2>
  <p class="mut">${esc(w.why || "")} — median of ${res.repeats} runs, ±${pct(res.totalMsSpread)} spread</p>

  <div class="cards">
    <div class="card"><div class="k">wall clock</div><div class="v">${num(g.wallMs)} ms</div></div>
    <div class="card"><div class="k">GPU busy</div><div class="v">${num(g.gpuBusyMs)} ms · ${pct(g.gpuShare)}</div></div>
    <div class="card"><div class="k">CPU (JS)</div><div class="v">${num(g.cpuMs)} ms · ${pct(g.cpuShare)}</div></div>
    <div class="card"><div class="k">stalled</div><div class="v">${num(g.stallMs)} ms · ${pct(g.stallShare)}</div></div>
    <div class="card"><div class="k">time-weighted attainment</div><div class="v">${pct(c.timeWeightedAttainment)}</div></div>
    <div class="card"><div class="k">per-tile stall</div><div class="v">${num(g.tileStallMs)} ms</div></div>
  </div>

  <div class="gate ${g.gateA.pass ? "pass" : "fail"}">
    <b>Gate A — Amdahl</b> · ${g.gateA.pass ? "PASS" : "FAIL"} at <b>${pct(g.gateA.value)}</b>
    (threshold ${pct(g.gateA.threshold)})<br><span class="mut">${esc(g.gateA.verdict)}</span></div>
  <div class="gate ${g.gateB.pass ? "pass" : "fail"}">
    <b>Gate B — headroom</b> · ${g.gateB.pass ? "PASS" : "FAIL"} at <b>${pct(g.gateB.value)}</b>
    (threshold ${pct(g.gateB.threshold)})<br><span class="mut">${esc(g.gateB.verdict)}</span></div>

  <h3>Stage split (wall clock)</h3>
  ${stackedBar(stageParts, g.wallMs)}

  <h3>GPU time by class</h3>
  ${stackedBar(clsParts, c.buckets ? Object.values(c.buckets).reduce((s, v) => s + v.ns, 0) : 1)}
  <p class="mut" style="margin-top:8px">Below-roof time by cause —
    ${Object.entries(c.causes || {}).filter(([, v]) => v.ns)
      .map(([k, v]) => `<b>${esc(k)}</b> ${pct(v.share)}`).join(", ") || "none"}.
    <code>traffic-amplification</code> means the kernel saturates bandwidth with re-reads it
    generated itself; <code>kernel-throughput</code> means it simply isn't issuing arithmetic fast enough.</p>

  <h3>Roofline (dot area ∝ time)</h3>
  ${roofline(res.dispatches, roofs)}

  <h3>Dispatches by total time</h3>
  <div class="scroll"><table>
    <thead><tr><th>label</th><th>n</th><th>ms</th><th>%</th><th>GFLOP/s</th><th>AI</th><th>AI req</th>
      <th>amp</th><th>MoC</th><th>wg</th><th>waves</th><th>tile waste</th><th>attain</th><th>class</th></tr></thead>
    <tbody>${rows.map((r) => `<tr>
      <td>${esc(r.label)}</td><td>${r.n}</td><td>${num(r.ns / 1e6, 1)}</td><td>${pct(r.ns / totalNs)}</td>
      <td>${num(r.gflops)}</td><td>${num(r.ai)}</td><td>${num(r.aiRequested, 1)}</td>
      <td>${r.amplification ? num(r.amplification, 1) + "×" : "—"}</td><td>${num(r.moc, 1)}</td>
      <td>${r.workgroups ?? "—"}</td><td>${num(r.waves, 1)}</td><td>${pct(r.tileWaste)}</td>
      <td>${pct(r.attainment)}</td>
      <td style="color:${CLS[r.class] || "#6e7681"};text-align:left">${esc(r.class)}</td></tr>`).join("")}
    </tbody></table></div>
  </div>`;
}

// Task 0.7: does the Cellpose result generalise, or is it about cyto3?
function renderCrossCheck(s, roofs, cellposeResults) {
  const c = s.classification;
  const cp = cellposeResults[0]?.classification?.timeWeightedAttainment;
  const clsParts = Object.entries(c.buckets).filter(([, v]) => v.ns > 0)
    .map(([k, v]) => ({ k, v: v.ns, c: CLS[k] }));
  const totalNs = clsParts.reduce((s2, p) => s2 + p.v, 0);
  return `<div class="wl">
    <h2>Cross-check <span class="pill">${esc(s.engine)}</span> <span class="pill">${s.workload.W}×${s.workload.H}</span></h2>
    <p class="mut">${esc(s.workload.why || "")} — a different U-shaped network with a separately
      written conv kernel of the same 16×16 / BLK=8 shape. If it lands in the same place, the
      finding is about this family of kernels rather than about cyto3.</p>
    <div class="cards">
      <div class="card"><div class="k">GPU busy</div><div class="v">${num(s.gpuBusyNs / 1e6)} ms</div></div>
      <div class="card"><div class="k">dispatches</div><div class="v">${s.dispatches.length}</div></div>
      <div class="card"><div class="k">attainment</div><div class="v">${pct(c.timeWeightedAttainment)}</div></div>
      <div class="card"><div class="k">cyto3, for comparison</div><div class="v">${pct(cp)}</div></div>
    </div>
    ${stackedBar(clsParts, totalNs)}
    <h3>Roofline</h3>
    ${roofline(s.dispatches, roofs)}
  </div>`;
}

const found = await findReport();
if (!found) {
  $("main").innerHTML = `<div class="note">No <code>results/phase0-*.json</code> found in the last 14 days.
    Run <code>node tools/profile.mjs</code> with a static server on the repo root.</div>`;
} else {
  const d = found.data, r = d.roofs;
  const overlapBad = d.results.some((x) => x.overlap && x.overlap.serial === false);
  $("main").innerHTML = `
    <p class="mut">${esc(found.url)} · generated ${esc(d.generated)} · GPU <b>${esc(d.gpu)}</b></p>

    ${!r.check.ok ? `<div class="note"><b>Roof check failed</b> (${num(r.check.computeVsSweepPlateau, 2)}×).
      ${esc(r.check.note)} Every attainment figure below is suspect.</div>` : ""}
    ${overlapBad ? `<div class="note"><b>Compute passes overlapped</b> on this run — the GPU ran passes
      concurrently, so per-dispatch attribution is not sound and only the per-encoder spans mean anything.</div>` : ""}

    <h2>Machine roofs <span class="pill">measured, not from a spec sheet</span></h2>
    <div class="cards">
      <div class="card"><div class="k">compute roof (swept)</div><div class="v">${num(r.sweep.peakGflops)} GFLOP/s</div></div>
      <div class="card"><div class="k">FMA probe</div><div class="v">${num(r.compute.gflops)} GFLOP/s</div></div>
      <div class="card"><div class="k">bandwidth</div><div class="v">${num(r.bandwidth.gbps)} GB/s</div></div>
      <div class="card"><div class="k">ridge (swept)</div><div class="v">${r.ridgeFromSweep} FLOP/B</div></div>
      <div class="card"><div class="k">ridge (ratio)</div><div class="v">${num(r.ridgeFromRatio)} FLOP/B</div></div>
      <div class="card"><div class="k">wave capacity</div><div class="v">${r.waveCapacity} wg</div></div>
      <div class="card"><div class="k">launch floor</div><div class="v">${num(d.launchFloor.medianNs)} ns</div></div>
    </div>
    <p class="mut">${esc(r.wave.note)}. For scale, an A100's ridge is ~150 FLOP/byte and an H100's ~295 —
    a U-Net stage that is memory-bound there can be compute-bound here, so the report's intensity-barbell
    argument does not transfer to this machine unchanged.</p>

    ${d.results.map((res) => renderWorkload(res, r)).join("")}
    ${d.stardist ? renderCrossCheck(d.stardist, r, d.results) : ""}`;
}
</script>
</body></html>
