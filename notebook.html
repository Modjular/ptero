<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ptero — notebook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🔬</text></svg>">
<link rel="stylesheet" href="src/style.css">
</head>
<body class="chat-open">
<div id="main">

<header id="topbar">
  <div class="topbar-brand">
    <span class="brand-mark">🔬</span>
    <span class="brand-name">ptero</span>
    <span id="stat" class="kernel-status">booting…</span>
    <div class="topbar-spacer"></div>
    <button id="chattoggle" class="btn-icon" title="Toggle assistant">💬</button>
    <button id="themetoggle" class="btn-icon" title="Toggle theme">🌙</button>
  </div>
  <div class="topbar-tools" role="toolbar">
    <button id="runall" title="Run all cells">▶▶ Run all</button>
    <span class="toolbar-divider"></span>
    <button id="choosews" class="btn-subtle" title="Choose workspace folder">📁 Choose folder</button>
    <button id="refreshws" class="btn-subtle" title="Re-read the folder">↻</button>
  </div>
  <p class="sub" id="workspace-info"></p>
</header>
<div id="downloads"></div>

<div id="cells"></div>
<div class="addcell-row"><button id="addcell" class="btn-subtle">+ add cell</button></div>

</div><!-- /#main -->

<aside id="chat">
  <div id="chatresize" class="chat-resize" title="Drag to resize"></div>
  <div class="chathead">
    <b>Co-scientist</b>
    <button id="chatreset" class="btn-subtle" title="Start a new conversation">↺</button>
    <button id="chatsettings" class="btn-subtle" title="API key and model">⚙</button>
  </div>
  <div id="chatlog"></div>
  <div class="chatbox">
    <textarea id="chatinput" rows="1" placeholder="Describe what you want to measure…"></textarea>
    <button id="chatsend">Send</button>
  </div>
</aside>

<dialog id="settings">
  <form method="dialog">
    <h2>Agent settings</h2>

    <label for="providersel">Provider</label>
    <select id="providersel"></select>

    <div id="baseurlfield" hidden>
      <label for="baseurl">Base URL</label>
      <input id="baseurl" type="text" spellcheck="false"
             placeholder="https://api.deepinfra.com/v1/openai">
      <p class="hint" id="baseurlhint">
        Defaults to DeepInfra. Point this at any OpenAI-compatible Chat Completions
        endpoint, e.g. a local server at http://127.0.0.1:8080/v1. A custom endpoint must
        serve CORS itself — there is no proxy.
      </p>
    </div>

    <label for="apikey" id="apikeylabel">API key</label>
    <input id="apikey" type="password" autocomplete="off">
    <p class="hint" id="keyhint"></p>

    <label for="modelname">Model</label>
    <div class="field-row">
      <input id="modelname" type="text" spellcheck="false" list="modellist"
             placeholder="model id">
      <button type="button" id="loadmodels" class="btn-subtle">List models</button>
    </div>
    <datalist id="modellist"></datalist>
    <p class="hint" id="modelhint">Keys and model choices are remembered per provider.</p>

    <div class="row">
      <button id="settingssave">Save</button>
      <button value="cancel" class="btn-subtle">Cancel</button>
    </div>
  </form>
</dialog>

<!-- Pyodide defines the global loadPyodide that kernel.js calls. -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.28.0/full/pyodide.js"></script>
<script type="module">
  import { start } from './src/notebook/ui.js';
  start();
</script>
</body>
</html>
